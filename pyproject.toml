[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ors-viewer"
version = "1.2.0rc5"
description = "Independent ORSSession extraction and local 3D visualization with controllable mesh simplification and oblique sections."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = ["numpy>=2.3,<3"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Visualization"]

[project.scripts]
ors-viewer = "ors_viewer:main"
ors-extract = "ors_extract:main"

[tool.setuptools]
py-modules = ["ors_viewer", "ors_extract", "ors_binary", "ors_decode"]
packages = ["viewer"]
include-package-data = false

[tool.setuptools.package-data]
viewer = ["web/*", "web/vendor/*", "fixtures/*"]
